<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easy See · JSON UI 编辑器</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">▦ <strong>EASY SEE</strong><span>JSON UI 编辑器</span></div><div><button id="demo">示例项目</button><button id="import">导入附加包</button><button id="undo">撤销</button><button id="redo">重做</button><button class="primary" id="export">导出项目 ↗</button></div></header>
<div class="sub"><span id="project">本地工作区</span><span>文件仅在本机处理 · 第二阶段预览版</span></div>
<main><aside><div class="heading">项目 / 控件树</div><input id="search" placeholder="搜索控件…" aria-label="搜索控件"><div id="tree"></div></aside><section class="workspace"><div class="toolbar"><span id="screenName">界面预览</span><div><select id="mode" aria-label="操作模式"><option value="edit">编辑模式 · 拖动控件</option><option value="preview">预览模式 · 点击交互</option></select><select id="resolution" aria-label="预览尺寸"><option value="640,360">640 × 360</option><option value="960,540">960 × 540</option><option value="320,240">320 × 240</option></select><select id="zoom" aria-label="缩放"><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.5">150%</option></select></div></div><div id="viewport"><div id="canvas"></div></div><div class="hint">拖入 .mcpack / .mcaddon / .zip / .json · 点击控件查看属性</div><section class="bottom"><div class="heading">问题检查 <span id="count"></span></div><div id="issues"></div><details><summary>当前文件源码</summary><textarea id="source" spellcheck="false" aria-label="JSON 源码"></textarea><button id="apply">应用源码修改</button></details></section></section><aside class="inspector"><div class="heading">控件属性</div><div id="properties"></div></aside></main>
<input id="files" type="file" multiple accept=".zip,.mcpack,.mcaddon,.json" hidden><div id="toast" role="status"></div><script src="vendor/jszip.min.js"></script><script type="module" src="src/app.js"></script></body></html>
